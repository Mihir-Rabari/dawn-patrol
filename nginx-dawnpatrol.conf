server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_types application/wasm application/octet-stream application/json text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # the model + wasm are immutable binaries — cache hard; one load then airplane mode is fine
    location /model/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location /vendor/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
